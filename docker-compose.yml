version: '3.8'

services:
  rag-engine:
    build: .
    container_name: gurbani-agentic-rag
    ports:
      - "4000:4000"
      - "8888:8888"
    environment:
      - PORT=4000
    volumes:
      - .:/app
    depends_on:
      - pgvector

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: gurbani-pgvector
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=gurbani_rag
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
